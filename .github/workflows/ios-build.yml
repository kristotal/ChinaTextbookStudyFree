name: iOS 构建 (iPhone/iPad 通用)

on:
  workflow_dispatch:          # 手动触发：Actions → iOS 构建 → Run workflow
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'      # 只在 iOS 工程变化时跑
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 阶段 1：无签名构建
  # 不需要任何证书/账号。免费 Apple ID 最简路线：
  #   下载本 job 产出的 IPA → Windows 上用 Sideloadly 登录免费
  #   Apple ID 直接签名安装（会重签，7 天有效，可一键刷新）。
  #   前提：仓库里的 project.yml 已换成 project.free.yml
  #        （去掉 Widget / App Groups，否则免费账号签不过）
  # ============================================================
  unsigned:
    name: 无签名构建（验证编译）
    runs-on: macos-15          # GitHub 托管的 macOS，自带 Xcode 16
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（project.yml → .xcodeproj）
        working-directory: apps/mobile
        run: xcodegen generate

      - name: 解析 SPM 依赖（ZIPFoundation）
        working-directory: apps/mobile
        run: |
          xcodebuild -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -resolvePackageDependencies

      - name: Archive（关闭代码签名）
        working-directory: apps/mobile
        run: |
          xcodebuild archive \
            -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChinaTextbookStudy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打成 .ipa（未签名，Sideloadly 可直接用）
        working-directory: apps/mobile
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ChinaTextbookStudy.xcarchive/Products/Applications/ChinaTextbookStudy.app Payload/
          zip -qr ChinaTextbookStudy-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ChinaTextbookStudy-unsigned
          path: apps/mobile/ChinaTextbookStudy-unsigned.ipa
          if-no-files-found: error

  # ============================================================
  # 阶段 2：签名构建（CI 侧手动签名，产出可直接安装的 IPA）
  # 可选。免费/付费开发账号通用，自己掌握证书，不依赖 Sideloadly 重签。
  # 未配置 Secrets 时自动跳过，不会报错。
  #
  # 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
  #   APPLE_P12_BASE64     开发证书 .p12 的 base64（本地 PowerShell）：
  #                        [Convert]::ToBase64String([IO.File]::ReadAllBytes("ios.p12"))
  #   APPLE_P12_PASSWORD   导出 p12 时设的密码
  #   APPLE_TEAM_ID        10 位 Team ID（免费个人账号也有）
  #   APPLE_PROFILE_NAME   描述文件名字（创建时自己命名，如 CSTF-Free）
  #   APPLE_PROFILE_BASE64 .mobileprovision 的 base64
  # ============================================================
  signed:
    name: 签名构建（可安装 IPA）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 没配 Secrets 就整体跳过，避免无谓的红叉
      - name: 检查签名 Secrets 是否已配置
        id: guard
        env:
          P12: ${{ secrets.APPLE_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::notice::未配置 APPLE_P12_BASE64，跳过 CI 签名。免费 Apple ID 推荐走 Sideloadly：下载上方“无签名构建”的 IPA，在 Windows 上登录 Apple ID 直接签名安装。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 XcodeGen
        if: steps.guard.outputs.skip != 'true'
        run: brew install xcodegen

      - name: 生成工程并解析依赖
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/mobile
        run: |
          xcodegen generate
          xcodebuild -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -resolvePackageDependencies

      # 把 p12 导入临时 keychain，只存在于这一次 CI 运行
      - name: 导入开发证书
        if: steps.guard.outputs.skip != 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KC_PW="ci-$(date +%s)"
          security create-keychain -p "$KC_PW" ci.keychain
          security set-keychain-settings -t 3600 -l ci.keychain
          security unlock-keychain -p "$KC_PW" ci.keychain
          security list-keychains -d user -s ci.keychain
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k ci.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool,apple: -s -k "$KC_PW" ci.keychain
          security find-identity -v -p codesigning

      - name: 安装描述文件
        if: steps.guard.outputs.skip != 'true'
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          PROFILE_NAME: ${{ secrets.APPLE_PROFILE_NAME }}
        run: |
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROF_DIR/$PROFILE_NAME.mobileprovision"
          ls -l "$PROF_DIR"

      - name: 编译并签名（iPhone 真机，通用 iPhone/iPad）
        if: steps.guard.outputs.skip != 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROFILE_NAME }}
        working-directory: apps/mobile
        run: |
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -m1 'Apple Development' \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "signing identity: $IDENTITY"
          xcodebuild build \
            -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IDENTITY"

      - name: 打成 .ipa
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/mobile
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChinaTextbookStudy.app Payload/
          zip -qr ChinaTextbookStudy-signed.ipa Payload

      - name: 上传 IPA 产物
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChinaTextbookStudy-signed
          path: apps/mobile/ChinaTextbookStudy-signed.ipa
          if-no-files-found: error
