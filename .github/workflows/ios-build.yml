name: iOS 构建 (iPhone/iPad 通用)

on:
  workflow_dispatch:          # 手动触发：Actions → iOS 构建 → Run workflow
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'      # 只在 iOS 工程变化时跑
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 阶段 1：无签名构建
  # 不需要任何证书/账号，验证工程能不能编译，产出 .app 供检查
  # ============================================================
  unsigned:
    name: 无签名构建（验证编译）
    runs-on: macos-15          # GitHub 托管的 macOS，自带 Xcode 16
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（project.yml → .xcodeproj）
        working-directory: apps/mobile
        run: xcodegen generate

      - name: 解析 SPM 依赖（ZIPFoundation）
        working-directory: apps/mobile
        run: |
          xcodebuild -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -resolvePackageDependencies

      - name: Archive（关闭代码签名）
        working-directory: apps/mobile
        run: |
          xcodebuild archive \
            -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChinaTextbookStudy.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打成 .ipa（未签名，仅供检查/解包）
        working-directory: apps/mobile
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ChinaTextbookStudy.xcarchive/Products/Applications/ChinaTextbookStudy.app Payload/
          zip -qr ChinaTextbookStudy-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ChinaTextbookStudy-unsigned
          path: apps/mobile/ChinaTextbookStudy-unsigned.ipa
          if-no-files-found: error

  # ============================================================
  # 阶段 2：签名构建（可安装到 iPhone/iPad 或上传 App Store）
  # 前置条件（二选一）：
  #   A. 付费 Apple 开发者账号（$99/年）+ App Store Connect API Key
  #      → 自动签名，App + Widget 描述文件全自动处理，推荐
  #   B. 免费 Apple ID + 手动制作的证书和描述文件
  #      → 见聊天记录里的说明，需先把 entitlements 里的
  #        App Groups / ubiquity 去掉（免费账号不支持这些 capability）
  #
  # 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
  #   APPLE_API_KEY_ID       AuthKey_XXXXXXXX.p8 里的 Key ID
  #   APPLE_API_ISSUER_ID    Issuer ID
  #   APPLE_API_KEY_BASE64   .p8 文件内容 base64（见下方步骤注释）
  #   APPLE_TEAM_ID          10 位 Team ID
  # ============================================================
  signed:
    name: 签名构建（可安装/可上架）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程并解析依赖
        working-directory: apps/mobile
        run: |
          xcodegen generate
          xcodebuild -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -resolvePackageDependencies

      # .p8 → base64 的方法（本地 PowerShell）：
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("AuthKey_XXXX.p8"))
      - name: 写入 App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      - name: Archive（自动签名，自动创建 App + Widget 描述文件）
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: apps/mobile
        run: |
          xcodebuild archive \
            -project ChinaTextbookStudy.xcodeproj \
            -scheme ChinaTextbookStudy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChinaTextbookStudy.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      # 导出方式三选一，改下面的 method 即可：
      #   development     → 装到自己注册过的设备（需在开发者后台加设备 UDID）
      #   app-store       → 上传 App Store Connect（之后用 altool / Transporter 提交）
      #   release-testing → TestFlight 内部分发
      - name: 导出 IPA
        working-directory: apps/mobile
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ChinaTextbookStudy.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ChinaTextbookStudy-signed
          path: apps/mobile/build/export/*.ipa
          if-no-files-found: error
